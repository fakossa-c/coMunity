<div
  style="
    font-family: Arial, sans-serif;
    font-size: 18px;
    line-height: 1.6;
    color: #121c2a;
    max-width: 560px;
  "
>
  <h1 style="font-size: 24px">Choisissez un nouveau mot de passe</h1>
  <p>Vous avez oublié votre mot de passe&nbsp;? Choisissez-en un nouveau.</p>
  <p>
    <a
      href="{{ .SiteURL }}/auth/confirmer?token_hash={{ .TokenHash }}&type=recovery"
      style="
        display: inline-block;
        padding: 16px 24px;
        border-radius: 16px;
        background: #273140;
        color: #ffffff;
        font-weight: bold;
        text-decoration: none;
      "
      >Choisir un nouveau mot de passe</a
    >
  </p>
  <p style="font-size: 16px; color: #594139">
    Ce lien ne sert qu'une fois. Si vous n'avez rien demandé, ignorez cet
    email&nbsp;: votre mot de passe ne change pas.
  </p>
</div>
